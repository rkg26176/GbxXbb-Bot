<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBX BigBasket Portal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bb-green: #10b981;
            --bg-color: #090d16;
            --text-color: #f8fafc;
            --card-bg: #111827;
            --border-color: #1f2937;
            --subtext-color: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }

        #browser-lock-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #090d16;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .lock-icon { font-size: 60px; margin-bottom: 16px; }
        .lock-title { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 8px; }
        .lock-desc { font-size: 14px; color: var(--subtext-color); margin-bottom: 24px; line-height: 1.5; }
        .telegram-btn {
            background: #0088cc; color: white; border: none; padding: 14px 28px;
            border-radius: 12px; font-weight: bold; font-size: 16px; text-decoration: none;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.4); display: inline-block;
        }

        .portal-header {
            padding: 18px 16px 12px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            margin-bottom: 14px;
        }
        .portal-header h2 { font-size: 16px; color: var(--bb-green); font-weight: 800; letter-spacing: 0.5px; }
        .portal-header p { font-size: 12px; color: var(--subtext-color); margin-top: 4px; }

        .tab-page { display: none; padding: 16px; }
        .tab-page.active-page { display: block; }
        .section-title { font-size: 17px; font-weight: 800; margin-bottom: 12px; color: #f8fafc; letter-spacing: -0.3px; }

        .accounts-scroll-box {
            max-height: 280px;
            overflow-y: auto;
            padding-right: 2px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .account-option-card {
            background: #1f2937; border: 1px solid var(--border-color); border-radius: 10px;
            padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; transition: all 0.2s;
        }
        .account-option-card.active-switch { border-color: var(--bb-green); background: #13221c; }
        .account-info { display: flex; align-items: center; gap: 10px; }
        .account-icon {
            width: 36px; height: 36px; background: #111827; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--bb-green);
        }
        .account-details .acc-name { font-weight: 700; font-size: 14px; color: #f8fafc; }
        .account-details .acc-phone { font-size: 11px; color: var(--subtext-color); margin-top: 2px; }
        
        .card-actions-col { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
        .switch-btn {
            background: #eab308; color: #000; border: none;
            padding: 5px 12px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer;
        }
        .account-option-card.active-switch .switch-btn { background: var(--bb-green); color: white; }
        
        .sub-actions-row { display: flex; gap: 4px; }
        .export-btn { background: #3b82f6; color: #fff; border: none; padding: 3px 6px; border-radius: 4px; font-weight: 600; font-size: 9px; cursor: pointer; }
        .delete-btn { background: #ef4444; color: #fff; border: none; padding: 3px 6px; border-radius: 4px; font-weight: 600; font-size: 9px; cursor: pointer; }

        .main-action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        .primary-action-btn {
            width: 100%; background: #1f2937; color: var(--bb-green); border: 2px solid var(--bb-green); padding: 14px;
            border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .primary-action-btn:hover { background: var(--bb-green); color: white; }

        /* Modal Popups */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-box {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
            width: 100%; max-width: 380px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-box h3 { font-size: 16px; margin-bottom: 12px; color: #f8fafc; font-weight: 700; }
        .input-field {
            width: 100%; background: #090d16; border: 1px solid var(--border-color); color: #f8fafc;
            padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none;
        }
        .modal-btn-row { display: flex; gap: 8px; }
        .modal-btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; }
        .modal-btn-confirm { background: var(--bb-green); color: white; }
        .modal-btn-cancel { background: #374151; color: #9ca3af; }

        .wallet-card {
            background: linear-gradient(135deg, #059669, #047857); color: white;
            padding: 24px; border-radius: 16px; box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3); margin-bottom: 20px;
        }
        .wallet-title { font-size: 13px; opacity: 0.9; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .wallet-bal { font-size: 36px; font-weight: 900; margin: 10px 0 16px 0; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: #111827;
            display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border-color); z-index: 200;
        }
        .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--subtext-color); cursor: pointer; font-weight: 600; }
        .nav-tab.active { color: var(--bb-green); }
    </style>
</head>
<body>

    <div id="browser-lock-screen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">Access Restricted</div>
        <div class="lock-desc">This Mini App can only be opened inside the Telegram Bot.</div>
        <a href="https://t.me/gbx_x_bb_bot" class="telegram-btn" target="_blank">Go to Telegram Bot</a>
    </div>

    <div class="portal-header">
        <h2>WELCOME TO GBX CAPITAL X BB</h2>
        <p>Switch and select your account</p>
    </div>

    <!-- TAB 1: MY ACCOUNTS -->
    <div id="page-accounts" class="tab-page active-page">
        <div class="section-title">📱 Connected Accounts</div>
        <div class="accounts-scroll-box" id="selector-accounts-list">
            <div style="text-align: center; color: var(--subtext-color); padding: 15px 0;">Loading accounts...</div>
        </div>

        <div class="main-action-buttons">
            <button class="primary-action-btn" onclick="openOtpModal()">🔑 Login with OTP</button>
            <button class="primary-action-btn" onclick="openJsonModal()">📁 Login with JSON Session</button>
        </div>
    </div>

    <!-- TAB 2: WALLET PAGE -->
    <div id="page-wallet" class="tab-page">
        <div class="wallet-card">
            <div class="wallet-title">💳 GBX Bot Wallet Balance</div>
            <div class="wallet-bal" id="bot-wallet-balance">₹0.00</div>
            <button style="width: 100%; background: #ffffff; color: #064e3b; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer;" onclick="triggerBotAddBalance()">➕ Add Money via Bot</button>
        </div>
    </div>

    <!-- OTP Modal Popup -->
    <div id="otp-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="otp-modal-title">🔑 Login with OTP</h3>
            <div id="otp-step-1">
                <input type="text" id="modal-phone" class="input-field" placeholder="Enter 10-digit mobile number">
                <div class="modal-btn-row">
                    <button class="modal-btn modal-btn-cancel" onclick="closeOtpModal()">Cancel</button>
                    <button class="modal-btn modal-btn-confirm" onclick="sendOtpRequest()">Send OTP</button>
                </div>
            </div>
            <div id="otp-step-2" style="display:none;">
                <input type="text" id="modal-otp-code" class="input-field" placeholder="Enter 6-digit OTP">
                <div class="modal-btn-row">
                    <button class="modal-btn modal-btn-cancel" onclick="closeOtpModal()">Cancel</button>
                    <button class="modal-btn modal-btn-confirm" onclick="verifyOtpAndSave()">Verify & Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JSON Modal Popup -->
    <div id="json-modal" class="modal-overlay">
        <div class="modal-box">
            <h3>📁 Login with JSON Session</h3>
            <textarea id="modal-json-input" class="input-field" rows="4" placeholder="Paste valid session JSON or token format here..."></textarea>
            <div class="modal-btn-row">
                <button class="modal-btn modal-btn-cancel" onclick="closeJsonModal()">Cancel</button>
                <button class="modal-btn modal-btn-confirm" onclick="submitJsonSession()">Save Session</button>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-tab active" id="tab-accounts-btn" onclick="switchTab('accounts')">
            <span>📱</span><span>My Accounts</span>
        </div>
        <div class="nav-tab" id="tab-wallet-btn" onclick="switchTab('wallet')">
            <span>👛</span><span>Wallet</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        function checkTelegramEnvironment() {
            if (!tg.initDataUnsafe || !tg.initDataUnsafe.user || !tg.initDataUnsafe.user.id) {
                document.getElementById('browser-lock-screen').style.display = 'flex';
            }
        }

        tg.ready();
        tg.expand();

        let userAccounts = [];
        let globalPhoneForOtp = "";

        function getTelegramUserId() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                return tg.initDataUnsafe.user.id;
            }
            return null;
        }

        async function loadSelectorAccounts() {
            const uid = getTelegramUserId();
            const container = document.getElementById('selector-accounts-list');
            if (!uid) {
                container.innerHTML = `<div style="text-align:center; color:var(--subtext-color); padding:10px;">Telegram User ID not found.</div>`;
                return;
            }

            container.innerHTML = `<div style="text-align: center; color: var(--subtext-color); padding: 15px 0;">Loading accounts...</div>`;

            try {
                let res = await fetch(`/api/user-accounts?user_id=${uid}`);
                let data = await res.json();
                userAccounts = data.accounts || [];

                if (userAccounts.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color:var(--subtext-color); padding:15px;">No saved accounts found. Use buttons below to add.</div>`;
                } else {
                    let html = '';
                    userAccounts.forEach((acc) => {
                        let isSelected = acc.active;
                        html += `
                            <div class="account-option-card ${isSelected ? 'active-switch' : ''}" id="acc-card-${acc.id}">
                                <div class="account-info">
                                    <div class="account-icon">📱</div>
                                    <div class="account-details">
                                        <div class="acc-name">${acc.name || 'BigBasket User'}</div>
                                        <div class="acc-phone">+91 ${acc.phone}</div>
                                    </div>
                                </div>
                                <div class="card-actions-col">
                                    <button class="switch-btn" onclick="switchAccountSession('${acc.id}')">${isSelected ? 'Active ✓' : 'Switch'}</button>
                                    <div class="sub-actions-row">
                                        <button class="export-btn" onclick="exportAuth('${acc.id}')">Export</button>
                                        <button class="delete-btn" onclick="deleteAccount('${acc.id}')">Delete</button>
                                    </div>
                                </div>
                            </div>`;
                    });
                    container.innerHTML = html;
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = `<div style="text-align:center; color:#ef4444; padding:15px;">Failed to load accounts.</div>`;
            }
        }

        async function switchAccountSession(id) {
            const uid = getTelegramUserId();
            let res = await fetch(`/api/set-active-session?user_id=${uid}&acc_id=${id}`);
            let data = await res.json();
            if(data.status === 'success') {
                alert("✅ Account session switched successfully!");
                loadSelectorAccounts();
            } else {
                alert("❌ Failed to switch session.");
            }
        }

        async function exportAuth(id) {
            const uid = getTelegramUserId();
            let res = await fetch(`/api/export-auth?user_id=${uid}&acc_id=${id}`);
            let data = await res.json();
            if(data.json_data) {
                navigator.clipboard.writeText(JSON.stringify(data.json_data, null, 2));
                alert("📋 Auth JSON copied to clipboard!");
            }
        }

        async function deleteAccount(id) {
            if(confirm("Are you sure you want to delete this account?")) {
                const uid = getTelegramUserId();
                let res = await fetch(`/api/delete-account?user_id=${uid}&acc_id=${id}`);
                let data = await res.json();
                if(data.status === 'success') {
                    alert("🗑️ Account deleted successfully.");
                    loadSelectorAccounts();
                } else {
                    alert("❌ Failed to delete account.");
                }
            }
        }

        // Modal Controls
        function openOtpModal() {
            document.getElementById('otp-modal').style.display = 'flex';
            document.getElementById('otp-step-1').style.display = 'block';
            document.getElementById('otp-step-2').style.display = 'none';
        }
        function closeOtpModal() { document.getElementById('otp-modal').style.display = 'none'; }

        function openJsonModal() { document.getElementById('json-modal').style.display = 'flex'; }
        function closeJsonModal() { document.getElementById('json-modal').style.display = 'none'; }

        async function sendOtpRequest() {
            const phone = document.getElementById('modal-phone').value.trim();
            const uid = getTelegramUserId();
            if(!phone || phone.length !== 10) { alert("Enter valid 10-digit phone number"); return; }
            
            globalPhoneForOtp = phone;
            let res = await fetch(`/api/send-otp`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: uid, phone: phone})
            });
            let data = await res.json();
            if(data.success) {
                alert("📨 OTP sent successfully via BigBasket API!");
                document.getElementById('otp-step-1').style.display = 'none';
                document.getElementById('otp-step-2').style.display = 'block';
            } else {
                alert("❌ Failed to send OTP: " + (data.message || 'Unknown error'));
            }
        }

        async function verifyOtpAndSave() {
            const otp = document.getElementById('modal-otp-code').value.trim();
            const uid = getTelegramUserId();
            if(!otp) { alert("Enter OTP"); return; }

            let res = await fetch(`/api/verify-otp`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: uid, phone: globalPhoneForOtp, otp: otp})
            });
            let data = await res.json();
            if(data.success) {
                alert("✅ OTP verified and account profile saved successfully!");
                closeOtpModal();
                document.getElementById('modal-phone').value = '';
                document.getElementById('modal-otp-code').value = '';
                loadSelectorAccounts();
            } else {
                alert("❌ Verification failed.");
            }
        }

        async function submitJsonSession() {
            const jsonText = document.getElementById('modal-json-input').value.trim();
            const uid = getTelegramUserId();
            try {
                let parsed = JSON.parse(jsonText);
                let res = await fetch(`/api/save-json`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: uid, json_data: parsed})
                });
                let data = await res.json();
                if(data.success) {
                    alert("✅ Valid JSON session saved and profile fetched successfully!");
                    closeJsonModal();
                    document.getElementById('modal-json-input').value = '';
                    loadSelectorAccounts();
                } else {
                    alert("❌ Failed to process JSON session.");
                }
            } catch(e) {
                alert("❌ Invalid JSON format! Please provide a valid session structure.");
            }
        }

        async function fetchBotWalletBalance() {
            const uid = getTelegramUserId();
            if (!uid) return;
            try {
                let res = await fetch(`/api/user-balance?user_id=${uid}`);
                let data = await res.json();
                if (data) {
                    document.getElementById('bot-wallet-balance').innerText = `₹${(data.balance || 0).toFixed(2)}`;
                }
            } catch (e) { console.error(e); }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`page-${tabName}`).classList.add('active-page');
            document.getElementById(`tab-${tabName}-btn`).classList.add('active');
            if (tabName === 'wallet') fetchBotWalletBalance();
        }

        function triggerBotAddBalance() { tg.sendData("ADD_BALANCE_TRIGGERED"); tg.close(); }

        window.addEventListener('DOMContentLoaded', () => {
            checkTelegramEnvironment();
            loadSelectorAccounts();
            fetchBotWalletBalance();
        });
    </script>
</body>
</html>
